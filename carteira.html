<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteira — RaizCoin</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Animação RaizCoin */
        .pulse {
            animation: pulseAnim 0.8s ease-out;
        }

        @keyframes pulseAnim {
            0% { transform: scale(1); color: #FFD76A; }
            50% { transform: scale(1.25); color: #ffea9a; }
            100% { transform: scale(1); color: #FFD76A; }
        }

        .rise {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: #FFD76A;
            opacity: 0;
            animation: riseAnim 1.2s ease-out forwards;
        }

        @keyframes riseAnim {
            0% { opacity: 1; transform: translate(-50%, -20%); }
            100% { opacity: 0; transform: translate(-50%, -120%); }
        }
    </style>
</head>

<body>

    <header>
        <h1>Carteira</h1>
        <nav>
            <a href="raizcoin_index.html">Início</a>
            <a href="carteira.html" class="active">Carteira</a>
            <a href="historico.html">Histórico</a>
            <a href="ganhardois.html">Ganhar</a>
        </nav>
    </header>

    <section class="info-section">

        <div class="home-card" style="position: relative;">
            <h3>Saldo Atual</h3>
            <p id="saldo">A carregar saldo…</p>

            <!-- Elemento para animação de subida -->
            <div id="animContainer"></div>
        </div>

    </section>

    <footer>
        <p>© 2024 Mundo Raiz</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } 
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD1JxgT8Qm2W0p4uHkGgkMZpQ0zVvYt1x0",
            authDomain: "mundoraiz-e8e08.firebaseapp.com",
            projectId: "mundoraiz-e8e08",
            storageBucket: "mundoraiz-e8e08.appspot.com",
            messagingSenderId: "1029384756",
            appId: "1:1029384756:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function carregarSaldo() {
            const saldoEl = document.getElementById("saldo");
            const animContainer = document.getElementById("animContainer");

            const docRef = doc(db, "users", "mario");
            const snap = await getDoc(docRef);

            if (!snap.exists()) {
                saldoEl.textContent = "0 RC";
                return;
            }

            const dados = snap.data();

            // CORREÇÃO IMPORTANTE:
            // O sistema grava "carteira", não "saldo"
            const saldo = dados.carteira || 0;

            // Animação RaizCoin
            saldoEl.classList.add("pulse");

            // Animação de subida (+X RC)
            const ganho = window.localStorage.getItem("ultimoGanhoRC");
            if (ganho) {
                const anim = document.createElement("div");
                anim.className = "rise";
                anim.textContent = "+" + ganho + " RC";
                animContainer.appendChild(anim);

                setTimeout(() => anim.remove(), 1500);
                window.localStorage.removeItem("ultimoGanhoRC");
            }

            saldoEl.textContent = saldo + " RC";
        }

        carregarSaldo();
    </script>

</body>
</html>
