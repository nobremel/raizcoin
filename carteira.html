<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Carteira — RaizCoin</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <h1>Carteira</h1>
        <nav>
            <a href="raizcoin_index.html">Início</a>
            <a href="historico.html">Histórico</a>
            <a href="ganhardois.html">Ganhar</a>
        </nav>
    </header>

    <!-- Secção principal -->
    <section class="info-section">

        <!-- Cartão do saldo -->
        <div class="home-card">
            <h3>Saldo Atual</h3>
            <p id="saldo">0 RC</p>
        </div>

        <!-- Cartão dos movimentos -->
        <div class="home-card">
            <h3>Movimentos</h3>
            <ul id="movimentos">
                <!-- Movimentos serão inseridos aqui pelo JS -->
            </ul>
        </div>

    </section>

    <!-- Rodapé -->
    <footer>
        © 2024 Mundo Raiz
    </footer>

    <!-- Script da carteira -->
    <script>
        // Carregar saldo
        const saldo = localStorage.getItem("raizcoin_saldo") || 0;
        document.getElementById("saldo").textContent = saldo + " RC";

        // Carregar movimentos
        const movimentos = JSON.parse(localStorage.getItem("raizcoin_movimentos") || "[]");
        const lista = document.getElementById("movimentos");

        movimentos.forEach(m => {
            const li = document.createElement("li");
            li.textContent = m;
            lista.appendChild(li);
        });
    </script>

</body>
</html>
